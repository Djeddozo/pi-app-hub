[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "pi-app-hub"
version = "1.0.0"
description = "A private application dashboard for Raspberry Pi"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "psutil>=6,<8", "docker>=7,<8", "watchdog>=6,<7"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.28,<1"]

[tool.setuptools.packages.find]
include = ["hub*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
